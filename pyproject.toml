[project]
name = "qcs_api_client"
version = "0.27.4"
description = "A client library for accessing Rigetti QCS API"
include = ["qcs_api_client/py.typed"]
authors = [{ name = "Rigetti QPU Software", email = "qpu-software@rigetti.com" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"

dependencies = [
    "attrs (>=25.4.0,<26.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.10.6,<3.0.0)",
    "pydantic-core (>=2.27.2,<3.0.0)",
    "pydantic-settings (>=2.8.1,<3.0.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "qcs-api-client-common (>=0.17.5,<0.19.0)",
    "rfc3339 (>=6.2,<7.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "toml (>=0.10.2,<0.11.0)",
]

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "respx (>=0.22.0,<0.23.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "ruff (>=0.15.6,<0.16.0)"
]
docs = [
    "sphinx (>=8.1.3)",
    "sphinx-autoapi (>=3.8.1,<4.0.0)",
    "furo (>=2025.12.19,<2026.0.0)",
    "myst-parser (>=4.0.1)"
]

[tool.poetry]
packages = [{ include = "qcs_api_client" }]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.docs]
optional = true
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
